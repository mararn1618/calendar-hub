name: Mac preview release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the Apple Silicon DMG
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check version and architecture
        id: version
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(lock.version, version);
          assert.equal(lock.packages[''].version, version);
          assert.equal(process.arch, 'arm64');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, 'v' + version, 'The tag must match the app version.');
          }
          NODE
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - run: npm run test:e2e
      - run: npm run package:dmg
      - name: Prepare release notes
        if: github.ref_type == 'tag'
        run: |
          git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF" > build/release/notes.md
          cat >> build/release/notes.md <<'NOTES'

          ## Install on Mac

          Download the DMG, open it and drag Calendar Hub into Applications. This preview requires Apple Silicon and macOS 14 or later.

          The app uses an ad hoc signature and has not been notarized by Apple. macOS may ask you to approve it on first launch. [Apple's guide to opening downloaded apps](https://support.apple.com/en-us/102445)
          NOTES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-preview
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Save packaged test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-test-diagnostics
          path: build/verification/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    name: Publish the verified preview
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64-preview
          path: installer
      - name: Attach the DMG and checksum to the release
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dmg="Calendar-Hub-${tag#v}-arm64.dmg"
          checksum="$dmg.sha256"
          test -s "$dmg"
          test -s "$checksum"
          test -s notes.md
          sha256sum --check "$checksum"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$BUILT_COMMIT"
          title="Calendar Hub ${tag#v} (Mac preview)"

          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets |
                jq -e --arg dmg "$dmg" --arg sum "$checksum" '[.assets[].name] | contains([$dmg, $sum])'
              echo 'The published release already contains the installer and checksum.'
              exit 0
            fi
            gh release upload "$tag" "$dmg" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md --prerelease --draft=false --latest=false
          else
            gh release create "$tag" "$dmg" "$checksum" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
